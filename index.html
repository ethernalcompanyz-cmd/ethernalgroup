/* Uploaded ETHERNAL CIRCLE logo + local-only feature pack */
.brand-mark{display:inline-flex;align-items:center;gap:10px}

.local-tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:28px 0 0}

.local-tool:hover{border-color:var(--silver);transform:translateY(-2px)}

.local-tool .tool-icon{font-size:17px;color:#ef2028}

.tool-panel{border:1px solid var(--line);padding:20px;margin-top:14px;background:var(--panel)}
.tool-panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.red-accent{--silver:#ff252d}
body.red-accent .brand,body.red-accent .section h2 em{color:#ff252d}
body.compact-cards .portrait{height:230px}
body.compact-cards .card-info{padding:12px}
body.focus-mode .noise,body.focus-mode .grid-bg{display:none}
.local-tool-row{display:flex;flex-wrap:wrap;gap:8px}
.local-tool-row .btn{min-height:38px;padding:0 12px;font-size:9px}
.visit-count{font:10px var(--mono);color:var(--muted)}
#backTop{position:fixed;right:18px;bottom:18px;z-index:40;width:43px;height:43px;border:1px solid var(--line);background:var(--panel);color:var(--text);display:none}
