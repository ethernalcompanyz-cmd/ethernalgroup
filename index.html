const KEY='ec_athena_members_v1', FILEKEY='ec_athena_files_v1', LOGKEY='ec_athena_log_v1', SETKEY='ec_athena_settings_v1';
let members=[],files=[],logs=[],settings={view:'grid',compact:false},page='overview',search='',roleFilter='all',statusFilter='all',sortBy='alias',editId=null,toastTimer;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function load(){try{const m=localStorage.getItem(KEY);members=m?JSON.parse(m):structuredClone(defaults);if(!Array.isArray(members))throw Error();}catch(e){members=structuredClone(defaults);notify('Database rusak atau tidak terbaca; data awal dimuat.')}try{files=JSON.parse(localStorage.getItem(FILEKEY)||'[]');if(!Array.isArray(files))files=[]}catch{files=[]}try{logs=JSON.parse(localStorage.getItem(LOGKEY)||'[]')}catch{logs=[]}try{settings={...settings,...JSON.parse(localStorage.getItem(SETKEY)||'{}')}}catch{}if(!localStorage.getItem(KEY))persist();}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(members));localStorage.setItem(FILEKEY,JSON.stringify(files));localStorage.setItem(LOGKEY,JSON.stringify(logs.slice(0,150)));localStorage.setItem(SETKEY,JSON.stringify(settings));}catch(e){notify('Gagal menyimpan. Periksa ruang penyimpanan browser.');return} }
function log(action,detail){logs.unshift({time:new Date().toISOString(),action,detail});logs=logs.slice(0,150);persist()}
function notify(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2800)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function validUrl(u){try{const x=new URL(u);return x.protocol==='https:'&&x.hostname==='www.instagram.com'}catch{return false}}
function usernameUrl(u){return 'https://www.instagram.com/'+String(u||'').replace(/^@/,'').replace(/[^a-zA-Z0-9._]/g,'')+'/'}
function counts(){return {total:members.length,admin:members.filter(m=>m.role==='Administrator').length,council:members.filter(m=>m.role==='Council').length,donatur:members.filter(m=>m.role==='Donatur').length,active:members.filter(m=>m.active!==false).length,fav:members.filter(m=>m.favorite).length}}
function setPage(p){page=p;$('#crumb').textContent=p.replace(/([A-Z])/g,' $1').toUpperCase();$('#sidebar').classList.remove('open');$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
function pageHead(kicker,title,sub,buttons=''){return `<div class="pagehead"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p class="sub">${sub}</p></div><div class="actions">${buttons}</div></div>`}
function statCard(label,num,icon,foot){return `<div class="stat"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><div class="stat-num">${num}</div><div class="stat-foot">${foot}</div></div>`}
function memberCard(m){const initials=(m.alias||'EC').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();return `<article class="member"><div class="membertop"><div class="avatar">${m.avatar?`<img src="${esc(m.avatar)}" alt="Avatar ${esc(m.alias)}" onerror="this.remove()">`:esc(initials)}</div><span class="tag">${esc(m.status||'CLASSIFIED')}</span><button class="favorite ${m.favorite?'on':''}" data-fav="${esc(m.id)}" title="Favorit">${m.favorite?'♥':'♡'}</button></div><h3>${esc(m.alias)}</h3><div class="handle">@${esc(m.username)}</div><p class="bio">${esc(m.bio||'Biography not added.')}</p><div class="membermeta"><span>ID <b>${esc(m.id)}</b></span><span>${esc(m.role)}</span><span><b>${Number(m.contribution)||0}%</b></span></div><div class="memberactions"><a class="btn small primary" href="${esc(validUrl(m.instagram)?m.instagram:usernameUrl(m.username))}" target="_blank" rel="noopener noreferrer">VISIT IG ↗</a><button class="btn small" data-copy="${esc(m.username)}">COPY</button><button class="btn small" data-view="${esc(m.id)}">VIEW</button><button class="btn small" data-edit="${esc(m.id)}">EDIT</button></div></article>`}
function filteredMembers(){let arr=[...members];if(search){const q=search.toLowerCase();arr=arr.filter(m=>[m.id,m.alias,m.username,m.instagram,m.bio,m.role,m.status].some(v=>String(v||'').toLowerCase().includes(q)))}if(roleFilter!=='all')arr=arr.filter(m=>m.role===roleFilter);if(statusFilter!=='all')arr=arr.filter(m=>statusFilter==='active'?m.active!==false:statusFilter==='inactive'?m.active===false:m.status===statusFilter);if(page==='council')arr=arr.filter(m=>m.role==='Council');if(page==='donatur')arr=arr.filter(m=>m.role==='Donatur');if(page==='administrators')arr=arr.filter(m=>m.role==='Administrator');if(page==='favorites')arr=arr.filter(m=>m.favorite);arr.sort((a,b)=>sortBy==='id'?a.id.localeCompare(b.id):sortBy==='role'?a.role.localeCompare(b.role):a.alias.localeCompare(b.alias));return arr}
function membersPage(){const labels={members:['MEMBER ARCHIVE','Member Database','Kelola seluruh profil anggota dalam satu arsip lokal.'],council:['COUNCIL DIRECTORY','Council','Daftar anggota dengan role Council.'],donatur:['CONTRIBUTOR DIRECTORY','Donatur','Daftar anggota dengan role Donatur.'],administrators:['ACCESS CONTROL DIRECTORY','Administrators','Daftar anggota dengan role Administrator.'],favorites:['PINNED RECORDS','Favorites','Anggota yang kamu tandai sebagai favorit.']};const [k,t,s]=labels[page];const arr=filteredMembers();return pageHead(k,t,s,`<button class="btn primary" data-action="add">＋ ADD MEMBER</button><button class="btn ghost" data-action="exportcsv">EXPORT CSV</button>`)+`<div class="toolbar"><input class="field" id="memberSearch" placeholder="SEARCH MEMBER ID, CODENAME, INSTAGRAM..." value="${esc(search)}"><select class="field" id="roleFilter"><option value="all">All roles</option>${['Council','Donatur','Administrator','Belum ditentukan'].map(r=>`<option ${roleFilter===r?'selected':''}>${r}</option>`).join('')}</select><select class="field" id="statusFilter"><option value="all">All status</option><option value="CLASSIFIED" ${statusFilter==='CLASSIFIED'?'selected':''}>CLASSIFIED</option><option value="active" ${statusFilter==='active'?'selected':''}>Active</option><option value="inactive" ${statusFilter==='inactive'?'selected':''}>Inactive</option></select><select class="field" id="sortBy"><option value="alias">Sort: Codename</option><option value="id" ${sortBy==='id'?'selected':''}>Sort: Member ID</option><option value="role" ${sortBy==='role'?'selected':''}>Sort: Role</option></select><button class="btn ghost" data-action="toggleview">${settings.view==='grid'?'☷ LIST VIEW':'▦ GRID VIEW'}</button></div><div class="panelhead"><h3>RECORDS <span class="red">${arr.length.toString().padStart(2,'0')}</span></h3><small>LOCAL DATABASE · AUTO-SAVE ENABLED</small></div><div class="membersgrid ${settings.view==='list'?'listmode':''}" id="membersgrid">${arr.length?arr.map(memberCard).join(''):'<div class="empty">NO MATCHING RECORDS<br><small>Coba ubah kata kunci atau filter.</small></div>'}</div>`}
function overview(){const c=counts();let roles=[['Council',c.council],['Administrator',c.admin],['Donatur',c.donatur],['Belum ditentukan',members.filter(m=>m.role==='Belum ditentukan').length]];return `<section class="hero"><div class="hero-inner"><div class="eyebrow">◈ CLASSIFIED COMMUNITY DATABASE</div><h2>ETHERNAL<span>CIRCLE ATHENA</span></h2><p>Beyond the ordinary. Within the circle. A private, local-first archive for member records and community operations.</p><div class="actions"><button class="btn primary" data-action="gotoMembers">ACCESS DATABASE ↗</button><button class="btn ghost" data-action="gotoFiles">OPEN CLASSIFIED FILES</button></div><div style="margin-top:20px;font-size:10px;letter-spacing:1.5px;color:#a89b9b"><span class="online"></span>SYSTEM ONLINE <span style="margin-left:15px">LOCAL ARCHIVE / ATHENA DIVISION</span></div></div></section><div class="stats">${statCard('TOTAL MEMBERS',c.total,'◈','Records registered')}${statCard('ADMINISTRATORS',c.admin,'⌘','Access management role')}${statCard('COUNCIL',c.council,'♜','Council directory')}${statCard('DONATUR',c.donatur,'✦','Contributor directory')}</div><div class="grid2"><section class="panel"><div class="panelhead"><h3>ROLE DISTRIBUTION</h3><small>LIVE LOCAL DATA</small></div>${roles.map(([r,n])=>`<div class="barrow"><span>${r}</span><div class="bar"><i style="width:${c.total?Math.round(n/c.total*100):0}%"></i></div><b>${n}</b></div>`).join('')}<div class="panelhead" style="margin-top:24px"><h3>MEMBER STATUS</h3><small>${c.active} ACTIVE / ${c.total-c.active} INACTIVE</small></div><div class="progress"><i style="width:${c.total?c.active/c.total*100:0}%"></i></div><p class="sub" style="margin-top:10px">${c.fav} records saved to favorites.</p></section><section class="panel"><div class="panelhead"><h3>RECENT ACTIVITY</h3><button class="btn small ghost" data-action="gotoActivity">VIEW ALL</button></div>${activityMarkup(5)}</section></div><section class="panel"><div class="panelhead"><h3>QUICK ACCESS / MEMBER RECORDS</h3><button class="btn small ghost" data-action="gotoMembers">VIEW DATABASE ↗</button></div><div class="membersgrid">${[...members].slice(0,3).map(memberCard).join('')}</div></section>`}
function activityMarkup(n=50){if(!logs.length)return '<p class="muted">Belum ada aktivitas tercatat. Aktivitas lokal akan muncul di sini.</p>';return `<div class="activity">${logs.slice(0,n).map(l=>`<div class="activityrow"><span class="dot"></span><div><b>${esc(l.action)}</b> — ${esc(l.detail)}<small>${new Date(l.time).toLocaleString('id-ID')}</small></div></div>`).join('')}</div>`}
function filesPage(){return pageHead('DOCUMENT VAULT','Classified Files','Arsip dokumen lokal. Contoh dokumen diberi label SAMPLE.',`<button class="btn primary" data-action="addfile">＋ NEW FILE</button>`)+`<div class="toolbar"><input class="field" id="fileSearch" placeholder="Search document title or ID..."><select class="field" id="fileCategory"><option value="all">All categories</option><option>Operations</option><option>Community</option><option>Reference</option></select></div><div class="filegrid" id="filegrid">${filesMarkup()}</div>`}
function filesMarkup(){let q=($('#fileSearch')?.value||'').toLowerCase(),cat=$('#fileCategory')?.value||'all';let arr=files.filter(f=>(cat==='all'||f.category===cat)&&[f.id,f.title,f.description].some(v=>String(v||'').toLowerCase().includes(q)));return arr.length?arr.map(f=>`<article class="filecard"><div class="fileico">▤</div><span class="tag">${esc(f.status||'SAMPLE')}</span><h3>${esc(f.title)}</h3><p>${esc(f.description)}</p><footer><span>${esc(f.id)} · ${esc(f.category)}</span><span><button class="btn small" data-editfile="${esc(f.id)}">EDIT</button> <button class="btn small danger" data-deletefile="${esc(f.id)}">×</button></span></footer></article>`).join(''):'<div class="empty">NO DOCUMENTS FOUND</div>'}
function backupPage(){return pageHead('DATA MANAGEMENT','Backup Center','Ekspor atau pulihkan data arsip dari browser ini.')+`<div class="settingsgrid"><section class="panel"><div class="panelhead"><h3>EXPORT DATA</h3><span class="red">⇧</span></div><p class="sub">Simpan salinan database anggota, arsip, log aktivitas, dan preferensi ke file JSON.</p><button class="btn primary" data-action="backup">DOWNLOAD FULL BACKUP JSON</button><hr style="border:0;border-top:1px solid #2b1b1b;margin:20px 0"><button class="btn" data-action="exportcsv">EXPORT MEMBERS CSV</button><button class="btn ghost" data-action="print">PRINT DATABASE</button></section><section class="panel"><div class="panelhead"><h3>IMPORT / RESTORE</h3><span class="red">↧</span></div><p class="sub">Mengimpor file JSON akan mengganti data yang ada setelah konfirmasi. Buat backup terlebih dahulu.</p><label class="btn" for="importFile">CHOOSE JSON FILE</label><input id="importFile" type="file" accept="application/json,.json" class="hidden"><p class="sub" id="importName" style="margin-top:12px">Belum ada file dipilih.</p><hr style="border:0;border-top:1px solid #2b1b1b;margin:20px 0"><button class="btn danger" data-action="restore">RESTORE DEFAULT DATA</button><button class="btn danger" data-action="reset">RESET ALL LOCAL DATA</button></section></div><section class="panel"><h3>LOCAL STORAGE NOTICE</h3><p class="aboutcopy">Data disimpan hanya di browser dan perangkat ini. Membersihkan data situs/browser dapat menghapus arsip. File backup JSON dapat berisi semua data lokal yang diekspor, jadi simpan di tempat yang aman.</p></section>`}
function settingsPage(){return pageHead('PREFERENCES','Settings','Sesuaikan tampilan dan kelola penyimpanan lokal.')+`<div class="settingsgrid"><section class="panel"><div class="panelhead"><h3>DISPLAY</h3></div><div class="settingrow"><div><p>Card view</p><small>Pilih tata letak database</small></div><select class="field" id="settingView"><option value="grid" ${settings.view==='grid'?'selected':''}>Grid</option><option value="list" ${settings.view==='list'?'selected':''}>List</option></select></div><div class="settingrow"><div><p>Compact layout</p><small>Kurangi jarak antarelemen</small></div><input type="checkbox" class="toggle" id="compactToggle" ${settings.compact?'checked':''}></div><div class="settingrow"><div><p>Reduced motion</p><small>Ikuti preferensi animasi sistem</small></div><span class="muted">OS preference</span></div></section><section class="panel"><div class="panelhead"><h3>DATABASE STATUS</h3></div><div class="settingrow"><div><p>Storage engine</p><small>Browser localStorage</small></div><span class="badge">ACTIVE</span></div><div class="settingrow"><div><p>Member records</p><small>Data tersimpan lokal</small></div><b>${members.length}</b></div><div class="settingrow"><div><p>Document records</p><small>Arsip tersimpan lokal</small></div><b>${files.length}</b></div><div class="settingrow"><div><p>Activity entries</p><small>Riwayat terbaru</small></div><b>${logs.length}</b></div><button class="btn primary" data-action="backup" style="margin-top:15px">CREATE BACKUP</button></section></div>`}
function analyticsPage(){const c=counts();return pageHead('INTELLIGENCE OVERVIEW','Analytics','Statistik dihitung dari data lokal saat ini.')+`<div class="stats">${statCard('TOTAL RECORDS',c.total,'◈','Member profiles')}${statCard('ACTIVE',c.active,'●','Active records')}${statCard('FAVORITES',c.fav,'♡','Pinned profiles')}${statCard('CLASSIFIED FILES',files.length,'▤','Local documents')}</div><section class="panel"><div class="panelhead"><h3>CONTRIBUTION INDEX</h3><small>USER-EDITED VALUES</small></div>${members.length?members.map(m=>`<div class="barrow" style="grid-template-columns:100px 1fr 42px"><span>${esc(m.alias)}</span><div class="bar"><i style="width:${Math.max(0,Math.min(100,Number(m.contribution)||0))}%"></i></div><b>${Number(m.contribution)||0}%</b></div>`).join(''):'<p class="muted">No records yet.</p>'}</section><section class="panel"><div class="panelhead"><h3>ROLE COUNTS</h3></div>${['Council','Administrator','Donatur','Belum ditentukan'].map(r=>`<div class="settingrow"><span>${r}</span><b>${members.filter(m=>m.role===r).length}</b></div>`).join('')}</section>`}

function render(){const c=$('#content');if(['members','council','donatur','administrators','favorites'].includes(page)){c.innerHTML=membersPage();wireMemberTools()}else if(page==='overview'){c.innerHTML=overview()}else if(page==='files'){c.innerHTML=filesPage();wireFileTools()}else if(page==='activity'){c.innerHTML=pageHead('AUDIT TRAIL','Activity Log','Riwayat perubahan yang dicatat di browser ini.',`<button class="btn ghost" data-action="clearlogs">CLEAR LOG</button>`)+`<section class="panel">${activityMarkup(100)}</section>`}else if(page==='backup'){c.innerHTML=backupPage();$('#importFile').addEventListener('change',importBackup)}else if(page==='settings'){c.innerHTML=settingsPage();$('#settingView').addEventListener('change',e=>{settings.view=e.target.value;persist();render()});$('#compactToggle').addEventListener('change',e=>{settings.compact=e.target.checked;document.body.style.zoom=settings.compact?'.97':'1';persist();notify('Display preferences saved')})}else if(page==='analytics'){c.innerHTML=analyticsPage()}else if(page==='about'){c.innerHTML=aboutPage()}else{c.innerHTML=overview()}}
function wireMemberTools(){const s=$('#memberSearch');if(s)s.addEventListener('input',e=>{search=e.target.value;const pos=e.target.selectionStart;const g=$('#membersgrid');if(g){const temp=document.createElement('div');temp.innerHTML=filteredMembers().length?filteredMembers().map(memberCard).join(''):'<div class="empty">NO MATCHING RECORDS</div>';g.replaceWith(temp.firstElementChild);renderMemberGridOnly()} });const r=$('#roleFilter');if(r)r.addEventListener('change',e=>{roleFilter=e.target.value;render()});const st=$('#statusFilter');if(st)st.addEventListener('change',e=>{statusFilter=e.target.value;render()});const so=$('#sortBy');if(so)so.addEventListener('change',e=>{sortBy=e.target.value;render()})}
function renderMemberGridOnly(){const old=$('#membersgrid');if(old){old.innerHTML=filteredMembers().length?filteredMembers().map(memberCard).join(''):'<div class="empty">NO MATCHING RECORDS</div>';}}
function wireFileTools(){const s=$('#fileSearch'),c=$('#fileCategory');const update=()=>{$('#filegrid').innerHTML=filesMarkup()};s?.addEventListener('input',update);c?.addEventListener('change',update)}
function openModal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modalback').classList.add('open')}
function closeModal(){$('#modalback').classList.remove('open');editId=null}
function memberForm(m={}){const v=(k,d='')=>esc(m[k]??d);return `<form id="memberForm"><div class="formgrid"><div class="formgroup"><label>MEMBER ID *</label><input class="field" name="id" required value="${v('id',nextId())}" ${m.id?'readonly':''}></div><div class="formgroup"><label>CODENAME *</label><input class="field" name="alias" required maxlength="50" value="${v('alias')}"></div><div class="formgroup"><label>INSTAGRAM USERNAME *</label><input class="field" name="username" required pattern="[A-Za-z0-9._]{1,30}" value="${v('username')}" placeholder="username tanpa @"></div><div class="formgroup"><label>INSTAGRAM URL</label><input class="field" name="instagram" value="${v('instagram')||'https://www.instagram.com/'}" placeholder="https://www.instagram.com/username/"></div><div class="formgroup"><label>ROLE</label><select class="field" name="role">${['Council','Donatur','Administrator','Belum ditentukan','Member'].map(r=>`<option ${v('role','Belum ditentukan')===r?'selected':''}>${r}</option>`).join('')}</select></div><div class="formgroup"><label>STATUS</label><select class="field" name="status">${['CLASSIFIED','ACTIVE','PENDING','ARCHIVED'].map(r=>`<option ${v('status','CLASSIFIED')===r?'selected':''}>${r}</option>`).join('')}</select></div><div class="formgroup"><label>CONTRIBUTION (%)</label><input class="field" name="contribution" type="number" min="0" max="100" value="${v('contribution','40')}"></div><div class="formgroup"><label>AVATAR IMAGE URL (OPTIONAL)</label><input class="field" name="avatar" value="${v('avatar')}" placeholder="https://..."></div><div class="formgroup full"><label>BIOGRAPHY</label><textarea class="field" name="bio" rows="2">${v('bio','Biography not added.')}</textarea></div><div class="formgroup full"><label>INTERNAL NOTE</label><textarea class="field" name="note" rows="2">${v('note')}</textarea></div><div class="formgroup"><label>ACCOUNT STATUS</label><select class="field" name="active"><option value="true" ${m.active!==false?'selected':''}>Active</option><option value="false" ${m.active===false?'selected':''}>Inactive</option></select></div><div class="formgroup"><label>FAVORITE</label><select class="field" name="favorite"><option value="false" ${!m.favorite?'selected':''}>No</option><option value="true" ${m.favorite?'selected':''}>Yes</option></select></div></div><div class="modalfoot"><button type="button" class="btn ghost" id="cancelModal">CANCEL</button><button class="btn primary" type="submit">SAVE RECORD</button></div></form>`}
function nextId(){let n=1;while(members.some(m=>m.id==='EC-'+String(n).padStart(3,'0')))n++;return 'EC-'+String(n).padStart(3,'0')}
function addMember(){editId=null;openModal('ADD MEMBER RECORD',memberForm());$('#cancelModal').onclick=closeModal;$('#memberForm').onsubmit=saveMember}
function editMember(id){const m=members.find(x=>x.id===id);if(!m)return;editId=id;openModal('EDIT MEMBER RECORD',memberForm(m));$('#cancelModal').onclick=closeModal;$('#memberForm').onsubmit=saveMember}
function saveMember(e){e.preventDefault();const fd=new FormData(e.target),m=Object.fromEntries(fd.entries());m.id=m.id.trim().toUpperCase();m.alias=m.alias.trim();m.username=m.username.trim().replace(/^@/,'');if(!/^[A-Z0-9-]{3,20}$/.test(m.id)){notify('Format Member ID tidak valid');return}if(!/^[a-zA-Z0-9._]{1,30}$/.test(m.username)){notify('Format username Instagram tidak valid');return}if(members.some(x=>x.id===m.id&&x.id!==editId)){notify('Member ID sudah digunakan');return}if(!m.instagram||m.instagram==='https://www.instagram.com/' )m.instagram=usernameUrl(m.username);if(!validUrl(m.instagram)){notify('URL harus berupa link https://www.instagram.com/');return}if(m.avatar){try{const u=new URL(m.avatar);if(!['https:','data:'].includes(u.protocol))throw Error()}catch{notify('URL avatar tidak valid');return}}m.contribution=Math.max(0,Math.min(100,Number(m.contribution)||0));m.active=m.active==='true';m.favorite=m.favorite==='true';const idx=members.findIndex(x=>x.id===editId);if(idx>=0){members[idx]={...members[idx],...m};log('MEMBER UPDATED',m.alias+' / '+m.id)}else{members.push(m);log('MEMBER CREATED',m.alias+' / '+m.id)}persist();closeModal();render();notify('Member record saved')}
function viewMember(id){const m=members.find(x=>x.id===id);if(!m)return;openModal('CLASSIFIED MEMBER PROFILE',`<div class="logorow"><div class="avatar" style="width:70px;height:70px">${m.avatar?`<img src="${esc(m.avatar)}" alt="">`:esc(m.alias.slice(0,2))}</div><div><span class="tag">${esc(m.status)}</span><h2 style="margin:7px 0 0">${esc(m.alias)}</h2><span class="muted">@${esc(m.username)}</span></div></div><div class="settingsgrid" style="margin-top:20px"><div class="panel"><small class="muted">MEMBER ID</small><h3>${esc(m.id)}</h3></div><div class="panel"><small class="muted">ROLE</small><h3>${esc(m.role)}</h3></div><div class="panel"><small class="muted">CONTRIBUTION</small><h3>${Number(m.contribution)||0}%</h3></div><div class="panel"><small class="muted">ACCOUNT STATUS</small><h3>${m.active?'ACTIVE':'INACTIVE'}</h3></div></div><p><b>Biography</b><br>${esc(m.bio||'Biography not added.')}</p><p><b>Internal note</b><br>${esc(m.note||'No internal note.')}</p><div class="modalfoot"><a class="btn primary" target="_blank" rel="noopener noreferrer" href="${esc(validUrl(m.instagram)?m.instagram:usernameUrl(m.username))}">VISIT INSTAGRAM ↗</a><button class="btn" id="profileEdit">EDIT RECORD</button></div>`);$('#profileEdit').onclick=()=>editMember(id)}
function deleteMember(id){const m=members.find(x=>x.id===id);if(!m)return;if(confirm(`Hapus record ${m.alias} (${m.id})? Tindakan ini tidak dapat dibatalkan.`)){members=members.filter(x=>x.id!==id);persist();log('MEMBER DELETED',m.alias+' / '+m.id);render();notify('Record deleted')}}
function copyText(s){if(navigator.clipboard&&location.protocol!=='file:')navigator.clipboard.writeText(s).then(()=>notify('Copied to clipboard')).catch(()=>fallbackCopy(s));else fallbackCopy(s)}function fallbackCopy(s){const t=document.createElement('textarea');t.value=s;document.body.append(t);t.select();try{document.execCommand('copy');notify('Copied to clipboard')}catch{notify('Tidak dapat menyalin otomatis')}t.remove()}
function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportJSON(){download('eth ern alcircle-athena-backup.json'.replace(/ /g,''),JSON.stringify({version:1,exportedAt:new Date().toISOString(),members,files,logs,settings},null,2),'application/json');log('BACKUP EXPORTED','Full local archive')}
function exportCSV(){const keys=['id','alias','username','instagram','role','status','bio','contribution','active','favorite','note'];const csv=[keys.join(','),...members.map(m=>keys.map(k=>'"'+String(m[k]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');download('eth ernalcircle-members.csv'.replace(/ /g,''),'\ufeff'+csv,'text/csv;charset=utf-8');log('CSV EXPORTED',members.length+' records');notify('CSV export ready')}
function importBackup(e){const file=e.target.files[0];if(!file)return;$('#importName').textContent=file.name;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);const arr=Array.isArray(data)?data:data.members;if(!Array.isArray(arr)||arr.some(m=>!m.id||!m.alias||!m.username))throw Error('Struktur JSON tidak sesuai');if(new Set(arr.map(m=>m.id)).size!==arr.length)throw Error('Member ID duplikat');if(!confirm(`Import ${arr.length} record anggota? Data saat ini akan diganti.`))return;members=arr;files=Array.isArray(data.files)?data.files:[];logs=Array.isArray(data.logs)?data.logs:[];settings={...settings,...(data.settings||{})};persist();log('BACKUP IMPORTED',arr.length+' records');render();notify('Backup imported')}catch(err){notify('Import gagal: '+err.message)}};reader.readAsText(file)}
function addFile(existing){const f=existing||{id:'DOC-'+String(files.length+1).padStart(3,'0'),title:'',category:'Community',description:'',status:'SAMPLE'};openModal(existing?'EDIT DOCUMENT':'NEW CLASSIFIED DOCUMENT',`<form id="fileForm"><div class="formgrid"><div class="formgroup"><label>DOCUMENT ID *</label><input class="field" name="id" required value="${esc(f.id)}" ${existing?'readonly':''}></div><div class="formgroup"><label>CATEGORY</label><select class="field" name="category">${['Operations','Community','Reference'].map(x=>`<option ${x===f.category?'selected':''}>${x}</option>`).join('')}</select></div><div class="formgroup full"><label>TITLE *</label><input class="field" name="title" required value="${esc(f.title)}"></div><div class="formgroup full"><label>DESCRIPTION</label><textarea class="field" name="description" rows="3">${esc(f.description)}</textarea></div><div class="formgroup"><label>LABEL</label><select class="field" name="status">${['SAMPLE','CLASSIFIED','REFERENCE'].map(x=>`<option ${x===f.status?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="modalfoot"><button type="button" class="btn ghost" id="cancelModal">CANCEL</button><button class="btn primary">SAVE FILE</button></div></form>`);$('#cancelModal').onclick=closeModal;$('#fileForm').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));if(files.some(x=>x.id===v.id&&x.id!==existing?.id)){notify('Document ID already exists');return}if(existing)files=files.map(x=>x.id===existing.id?v:x);else files.unshift(v);persist();log(existing?'DOCUMENT UPDATED':'DOCUMENT CREATED',v.title+' / '+v.id);closeModal();render();notify('Document saved')}}
function action(a){switch(a){case'add':addMember();break;case'gotoMembers':setPage('members');break;case'gotoFiles':setPage('files');break;case'gotoActivity':setPage('activity');break;case'toggleview':settings.view=settings.view==='grid'?'list':'grid';persist();render();break;case'exportcsv':exportCSV();break;case'backup':exportJSON();break;case'print':window.print();break;case'addfile':addFile();break;case'clearlogs':if(confirm('Hapus semua log aktivitas?')){logs=[];persist();render();notify('Activity log cleared')}break;case'restore':if(confirm('Pulihkan 7 data anggota awal? Semua perubahan anggota akan diganti.')){members=structuredClone(defaults);persist();log('DEFAULT RESTORED','Seven initial member records');render();notify('Default records restored')}break;case'reset':if(confirm('Hapus seluruh data anggota, file, dan log lokal?')){members=[];files=[];logs=[];persist();render();notify('Local database reset')}break}}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){setPage(nav.dataset.page);return}const a=e.target.closest('[data-action]');if(a){action(a.dataset.action);return}const edit=e.target.closest('[data-edit]');if(edit){editMember(edit.dataset.edit);return}const view=e.target.closest('[data-view]');if(view){viewMember(view.dataset.view);return}const del=e.target.closest('[data-delete]');if(del){deleteMember(del.dataset.delete);return}const fav=e.target.closest('[data-fav]');if(fav){const m=members.find(x=>x.id===fav.dataset.fav);if(m){m.favorite=!m.favorite;persist();log(m.favorite?'FAVORITE ADDED':'FAVORITE REMOVED',m.alias);render();notify(m.favorite?'Added to favorites':'Removed from favorites')}return}const cp=e.target.closest('[data-copy]');if(cp){copyText(cp.dataset.copy);return}const ef=e.target.closest('[data-editfile]');if(ef){addFile(files.find(f=>f.id===ef.dataset.editfile));return}const df=e.target.closest('[data-deletefile]');if(df){const f=files.find(f=>f.id===df.dataset.deletefile);if(f&&confirm('Hapus dokumen '+f.title+'?')){files=files.filter(x=>x.id!==f.id);persist();log('DOCUMENT DELETED',f.title);render();notify('Document deleted')}return}});
$('#modalClose').onclick=closeModal;$('#modalback').addEventListener('click',e=>{if(e.target.id==='modalback')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#globalSearch').focus()}});$('#quickAdd').onclick=addMember;$('#menuToggle').onclick=()=>$('#sidebar').classList.toggle('open');$('#themeToggle').onclick=()=>{document.body.classList.toggle('lightmode');if(document.body.classList.contains('lightmode')){document.documentElement.style.setProperty('--bg','#171313');document.documentElement.style.setProperty('--panel','#201818');notify('Contrast mode toggled')}else{document.documentElement.style.setProperty('--bg','#050505');document.documentElement.style.setProperty('--panel','#101010');notify('Dark mode active')}};$('#globalSearch').addEventListener('input',e=>{search=e.target.value;if(search){setPage('members');const s=$('#memberSearch');if(s){s.value=search;s.dispatchEvent(new Event('input'))}}});
function tick(){const d=new Date();$('#sideclock').textContent=d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+' LOCAL';}load();if(!files.length){files=[{id:'DOC-001',title:'ATHENA ARCHIVE GUIDE',category:'Reference',description:'Sample document describing the local archive structure.',status:'SAMPLE'},{id:'DOC-002',title:'COMMUNITY OPERATIONS',category:'Operations',description:'Sample operational record. Replace with verified information.',status:'SAMPLE'},{id:'DOC-003',title:'MEMBER DIRECTORY NOTES',category:'Community',description:'Sample notes for organizing member records.',status:'SAMPLE'}];persist()}tick();setInterval(tick,1000);render();
</script></body></html>
